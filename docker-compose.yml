# Despliegue de Estratega 360 (Next.js standalone) detrás de Traefik.
#
# Autocontenido: construye la imagen desde el Dockerfile del repo (no requiere
# registro externo). En un host con Docker:
#   docker compose up -d --build
#
# La app NO publica puertos: se une a la red de Traefik y se enruta por labels.
# Traefik (ya presente en el server) resuelve el dominio y el TLS.
#
# Backend de datos: Firebase (Firestore/Auth) gestionado en la nube → sin BD.
#
# Variables (panel del proveedor o archivo .env):
#   APP_DOMAIN, TRAEFIK_NETWORK, TRAEFIK_ENTRYPOINT, TRAEFIK_CERTRESOLVER,
#   GEMINI_API_KEY, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, FIREBASE_SERVICE_ACCOUNT_KEY

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* se hornean en tiempo de BUILD.
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: estratega360:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Genkit / Google AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Firebase Admin SDK: JSON del service-account en UNA sola línea.
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY:-}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    # Sin "ports": Traefik llega a la app por la red interna (puerto 3000).
    # (Si despliegas SIN Traefik, añade:  ports: ["8080:3000"]  )
    expose:
      - "3000"
    networks:
      - traefik_net
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=${TRAEFIK_NETWORK:-traefik_net}'
      - 'traefik.http.routers.estratega360.rule=Host(`${APP_DOMAIN}`)'
      - 'traefik.http.routers.estratega360.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
      - 'traefik.http.routers.estratega360.tls=true'
      - 'traefik.http.routers.estratega360.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
      - 'traefik.http.services.estratega360.loadbalancer.server.port=3000'
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  # Red EXTERNA gestionada por Traefik (ya existe en el server).
  # Su nombre real puede llevar prefijo de proyecto (ej. root_traefik_net):
  #   docker network ls   ->   ponlo en TRAEFIK_NETWORK
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_net}
