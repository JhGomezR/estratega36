# Despliegue COMPLETO en la web de Estratega 360.
#
#   app   -> la aplicación Next.js (build desde el Dockerfile, salida standalone)
#   caddy -> reverse proxy con HTTPS automático (Let's Encrypt) delante de la app
#
# Backend de datos: Firebase (Firestore/Auth) es gestionado en la nube, por eso
# NO hay contenedor de base de datos.
#
# Uso:
#   1) Copia .env.example a .env y rellena los valores.
#   2) Coloca tu service-account.json (clave del Firebase Admin SDK) en la raíz.
#   3) docker compose up -d --build
#
# Local sin dominio: pon APP_DOMAIN=localhost en .env (Caddy usa TLS interno).
# En la web: apunta el DNS de tu dominio a este servidor y pon APP_DOMAIN=tudominio.com

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* se hornean en tiempo de BUILD (no en runtime).
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    image: estratega360:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Genkit / Google AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Firebase Admin SDK: usa el archivo de credenciales montado abajo.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service-account.json
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    volumes:
      # Monta la clave de servicio en solo-lectura (NO la metas en la imagen).
      - ./service-account.json:/run/secrets/service-account.json:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - estratega

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - estratega

volumes:
  caddy_data:
  caddy_config:

networks:
  estratega:
    driver: bridge
