# Despliegue COMPLETO en la web de Estratega 360.
#
#   app   -> la aplicación Next.js (build desde el Dockerfile, salida standalone)
#   caddy -> reverse proxy con HTTPS automático (Let's Encrypt) delante de la app
#
# Sin bind-mounts de archivos (fallan en plataformas gestionadas como Hostinger):
#   - El Caddyfile se hornea en la imagen de caddy (ver ./caddy/Dockerfile).
#   - Las credenciales de Firebase se pasan por la variable FIREBASE_SERVICE_ACCOUNT_KEY.
#
# Backend de datos: Firebase (Firestore/Auth) es gestionado en la nube → sin
# contenedor de base de datos.
#
# Variables requeridas (en el panel del proveedor o en un archivo .env):
#   APP_DOMAIN, GEMINI_API_KEY, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, FIREBASE_SERVICE_ACCOUNT_KEY

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* se hornean en tiempo de BUILD (no en runtime).
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    image: estratega360:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Genkit / Google AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Firebase Admin SDK: JSON de la cuenta de servicio (en una sola línea).
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - estratega

  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      # Volúmenes con NOMBRE (no bind-mounts) → seguros en cualquier host.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - estratega

volumes:
  caddy_data:
  caddy_config:

networks:
  estratega:
    driver: bridge
