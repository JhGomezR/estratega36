# Estratega 360 — despliegue Docker detras de Traefik (build desde el Dockerfile del repo).
#
#   docker compose up -d --force-recreate
#
# Se une explicitamente a la red externa de Traefik: traefik_net
# Backend de datos: Firebase (Firestore/Auth) en la nube -> sin contenedor de BD.
#
# Variables en .env:
#   APP_DOMAIN                        dominio publico (DNS ya apuntando al VPS)
#   TRAEFIK_ENTRYPOINT               entrypoint https de Traefik (websecure)
#   TRAEFIK_CERTRESOLVER             certresolver de TU Traefik (letsencrypt)
#   GEMINI_API_KEY                   (Genkit / IA)
#   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY  (mapa; se hornea en build)
#   FIREBASE_SERVICE_ACCOUNT_KEY     (Admin SDK; JSON en una sola linea)

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: estratega360:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY:-}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    expose:
      - "3000"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.estratega360.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.estratega360.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.estratega360.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.estratega360.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  # Red interna del proyecto (la crea Compose sola).
  default:
  # Red EXTERNA de Traefik (ya existe en el server).
  traefik:
    external: true
    name: traefik_net
