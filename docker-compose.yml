# Despliegue de Estratega 360 en plataformas gestionadas (Hostinger, etc.)
#
# Estas plataformas YA exponen su propio proxy + HTTPS en los puertos 80/443 y
# enrutan tu dominio hacia el contenedor. Por eso aquí NO levantamos un proxy
# propio (intentar tomar el 80 da "port is already allocated"): publicamos la
# app en un puerto y la plataforma se encarga del dominio y el TLS.
#
# Backend de datos: Firebase (Firestore/Auth) gestionado en la nube → sin
# contenedor de base de datos.
#
# Variables (en el panel del proveedor o en .env):
#   APP_PORT (opcional, def. 8080), GEMINI_API_KEY,
#   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, FIREBASE_SERVICE_ACCOUNT_KEY
#
# En Hostinger: tras desplegar, en el panel asocia tu dominio al puerto APP_PORT.
#
# (Si en cambio usas un VPS donde TÚ controlas 80/443 y quieres HTTPS propio,
#  hay una imagen de Caddy lista en ./caddy — añade ese servicio y publica 80/443.)

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* se hornean en tiempo de BUILD (no en runtime).
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    image: estratega360:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Genkit / Google AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Firebase Admin SDK: JSON de la cuenta de servicio (en una sola línea).
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    ports:
      # host:contenedor — NO usamos 80/443 (los gestiona la plataforma).
      - "${APP_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
