name: Build & Push Docker image (GHCR)

# Construye la imagen Docker en CI y la publica en GitHub Container Registry
# (GHCR). Hostinger NO compila imágenes locales: descarga esta imagen pública.
#
# Tras el primer push: ve a GitHub > Packages > "estratega360" > Package settings
# y cambia la visibilidad a PUBLIC (una sola vez) para que Hostinger pueda bajarla
# sin credenciales.
#
# Opcional: define el secreto de repo NEXT_PUBLIC_GOOGLE_MAPS_API_KEY para que el
# mapa funcione (se hornea en build).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/estratega360:latest
            ghcr.io/${{ env.OWNER_LC }}/estratega360:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
